name: Tests
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app-mode: [SOLO, MULTIUSER]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
      APP_MODE: ${{ matrix.app-mode }}
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postcard_test
      SECRET_KEY_BASE: test-only-secret-key-base
      DISABLE_ANONYMOUS_TELEMETRY: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
      GROVER_NO_SANDBOX: 'true'
    steps:
      - uses: actions/checkout@v7
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libpq-dev libvips libvips-tools
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install browser libraries
        run: sudo npx puppeteer browsers install chrome --install-deps
      - name: Prepare database and assets
        run: |
          bundle exec rails db:create db:migrate
          bundle exec rails assets:precompile
      - name: Check Zeitwerk autoloading
        run: bundle exec rails zeitwerk:check
      - name: Run all Rails tests
        run: bundle exec rails test:all
      - name: Verify browser image generation
        run: npm test
      - name: Run Brakeman
        run: bundle exec brakeman
      - name: Audit Ruby dependencies
        run: bundle exec bundler-audit check --update

  docker-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build -t postcard:test .
      - name: Verify Rails boots without deployment credentials
        run: >-
          docker run --rm --entrypoint bundle
          -e RAILS_ENV=build -e SECRET_KEY_BASE=DUMMY postcard:test
          exec rails runner 'puts Rails.version'
      - name: Verify the image includes a working browser
        run: docker run --rm --entrypoint npm postcard:test test
