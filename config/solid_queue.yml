default: &default
  dispatchers:
    - polling_interval: 60
      batch_size: 500
      concurrency_maintenance: false
      recurring_tasks:
        verify_recent_domains:
          class: VerifyDomainsJob
          args:
            - recent
          schedule: every 15 minutes
        verify_stale_domains:
          class: VerifyDomainsJob
          args:
            - stale
          schedule: "0 4 * * * America/New_York"
        enqueue_analytics_summary_emails:
          class: EnqueueAnalyticsSummaryEmailsJob
          schedule: "0 0 10 * * * America/New_York"
        visits_in_last_day:
          class: VisitsInLastDayJob
          schedule: "0 8 * * * America/Los_Angeles"
        telemetry:
          class: TelemetryJob
          schedule: every 1 hour
        cleanup_tracking_data:
          class: CleanupTrackingDataJob
          schedule: "0 3 * * * America/New_York"
  workers:
    - queues: "*"
      threads: 2
      processes: 1
      polling_interval: 30

development:
 <<: *default

test:
 <<: *default

production:
 <<: *default
